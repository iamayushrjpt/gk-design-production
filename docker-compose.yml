services:
  mongo:
    image: mongo:7
    container_name: gk-design-mongo-test
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - gk_design_mongo_test_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: gk-design-backend-test:local
    container_name: gk-design-backend-test
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI}

volumes:
  gk_design_mongo_test_data:
